<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Me & My Chaos 🤪</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff4c2;
            color: #222;
            text-align: center;
        }

        header {
            padding: 70px 20px;
            background: #ff6b6b;
            border-bottom: 6px solid #222;
        }

        h1 {
            font-size: 48px;
            margin: 0;
        }

        header p {
            font-size: 20px;
            margin-top: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            transform: rotate(-2deg) scale(1.05);
        }

        section {
            padding: 50px 20px;
        }

        .card {
            max-width: 700px;
            margin: 20px auto;
            padding: 25px;
            background: white;
            border: 4px solid #222;
            border-radius: 20px;
            box-shadow: 8px 8px 0 #222;
        }

        h2 {
            font-size: 32px;
        }

        .chaos {
            font-size: 60px;
            margin: 10px;
        }

        #fact {
            font-size: 20px;
            min-height: 30px;
        }

        footer {
            padding: 30px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>

        <div class="chaos">🤪💥🧠</div>
